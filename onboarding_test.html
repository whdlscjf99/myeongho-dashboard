<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온보딩 모달 테스트</title>
  <style>
    :root {
      --bg-main: #fefefe;
      --bg-inner: #f4f4f4;
      --text-main: #2e2e2e;
      --text-sub: #666;
      --accent: #4a90d9;
      --border: #ddd;
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #e8e8e8;
    }
    
    .btn-mini {
      background: #cfe6f8;
      color: #2d5d85;
      border: 1px solid rgba(43,123,187,.15);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: .52em;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .btn-mini:hover {
      background: #b9daf5;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    
    .input-box {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 10px;
      outline: none;
      font-size: .74em;
      background: var(--bg-inner);
      color: var(--text-main);
      box-sizing: border-box;
    }
    
    .ob-grade-btn.active, .ob-room-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div style="text-align:center;margin-bottom:20px;">
    <h1>온보딩 모달 테스트</h1>
    <button onclick="showModal()" style="padding:10px 20px;font-size:1em;cursor:pointer;">모달 열기</button>
  </div>

  <!-- 온보딩 모달 -->
  <div id="onboarding-modal" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.7);align-items:center;justify-content:center;">
    <div style="background:var(--bg-main);border-radius:18px;padding:28px 32px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.4);">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:2.2em;margin-bottom:6px;">👋</div>
        <h2 style="font-size:1.1em;font-weight:900;color:var(--accent);margin:0;">명호중 대시보드 초기 설정</h2>
        <p style="font-size:.75em;color:var(--text-sub);margin-top:4px;">아래 정보를 입력하면 급식·시간표·캘린더가 자동으로 연동됩니다.<br>나중에 ⚙️ 설정에서 언제든 수정할 수 있어요.</p>
      </div>

      <!-- 기본 정보 -->
      <div style="font-size:.76em;font-weight:900;color:var(--accent);margin-bottom:6px;">📋 기본 정보</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">선생님 성함</div>
          <input id="ob-teacher-name" class="input-box" type="text" placeholder="예: 조인철">
        </div>
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">담당 학년</div>
          <div style="display:flex;gap:4px;">
            <button type="button" class="ob-grade-btn btn-mini" data-grade="1" onclick="obSelectGrade(1)" style="flex:1;">1학년</button>
            <button type="button" class="ob-grade-btn btn-mini" data-grade="2" onclick="obSelectGrade(2)" style="flex:1;">2학년</button>
            <button type="button" class="ob-grade-btn btn-mini" data-grade="3" onclick="obSelectGrade(3)" style="flex:1;">3학년</button>
          </div>
        </div>
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">담당 반</div>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px;">
            <button type="button" class="ob-room-btn btn-mini" data-room="1"  onclick="obSelectRoom(1)"  style="font-size:.66em;">1</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="2"  onclick="obSelectRoom(2)"  style="font-size:.66em;">2</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="3"  onclick="obSelectRoom(3)"  style="font-size:.66em;">3</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="4"  onclick="obSelectRoom(4)"  style="font-size:.66em;">4</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="5"  onclick="obSelectRoom(5)"  style="font-size:.66em;">5</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="6"  onclick="obSelectRoom(6)"  style="font-size:.66em;">6</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="7"  onclick="obSelectRoom(7)"  style="font-size:.66em;">7</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="8"  onclick="obSelectRoom(8)"  style="font-size:.66em;">8</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="9"  onclick="obSelectRoom(9)"  style="font-size:.66em;">9</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="10" onclick="obSelectRoom(10)" style="font-size:.66em;">10</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="11" onclick="obSelectRoom(11)" style="font-size:.66em;">11</button>
            <button type="button" class="ob-room-btn btn-mini" data-room="12" onclick="obSelectRoom(12)" style="font-size:.66em;">12</button>
          </div>
        </div>
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">학교 코드 (기본값 유지 가능)</div>
          <input id="ob-school-code" class="input-box" type="text" placeholder="예: 7201025" value="7201025">
        </div>
      </div>

      <div style="border-top:1px solid var(--border);margin:8px 0 12px;"></div>

      <!-- API 키 -->
      <div style="font-size:.76em;font-weight:900;color:var(--accent);margin-bottom:6px;">🔑 API 키 <span style="font-weight:400;color:var(--text-sub);">(선택 — 나중에 설정 가능)</span></div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:18px;">
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">NEIS Open API 인증키</div>
          <input id="ob-meal-api-key" class="input-box" type="text" placeholder="open.neis.go.kr 에서 발급">
        </div>
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">Google API Key</div>
          <input id="ob-gcal-api-key" class="input-box" type="text" placeholder="캘린더 연동 시 필요">
        </div>
        <div>
          <div style="font-size:.66em;font-weight:800;color:var(--text-sub);margin-bottom:3px;">Anthropic API Key <span style="font-weight:400;">(AI 비서)</span></div>
          <input id="ob-anthropic-key" class="input-box" type="password" placeholder="sk-ant-...">
        </div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn-mini" onclick="completeOnboarding(false)" style="color:var(--text-sub);">나중에 설정</button>
        <button class="btn-mini" onclick="completeOnboarding(true)" style="background:var(--accent);color:#fff;border-color:var(--accent);">설정 완료 →</button>
      </div>
    </div>
  </div>

  <script>
    let selectedGrade = null;
    let selectedRoom = null;

    function showModal() {
      document.getElementById('onboarding-modal').style.display = 'flex';
    }

    function obSelectGrade(grade) {
      selectedGrade = grade;
      document.querySelectorAll('.ob-grade-btn').forEach(btn => {
        if (parseInt(btn.dataset.grade) === grade) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function obSelectRoom(room) {
      selectedRoom = room;
      document.querySelectorAll('.ob-room-btn').forEach(btn => {
        if (parseInt(btn.dataset.room) === room) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function completeOnboarding(saveData) {
      const teacherName = document.getElementById('ob-teacher-name').value.trim();
      const schoolCode = document.getElementById('ob-school-code').value.trim();
      const mealApiKey = document.getElementById('ob-meal-api-key').value.trim();
      const gcalApiKey = document.getElementById('ob-gcal-api-key').value.trim();
      const anthropicKey = document.getElementById('ob-anthropic-key').value.trim();

      if (saveData) {
        console.log('저장할 데이터:', {
          teacherName,
          grade: selectedGrade,
          room: selectedRoom,
          schoolCode,
          mealApiKey,
          gcalApiKey,
          anthropicKey
        });
        alert('설정이 저장되었습니다!');
      } else {
        alert('나중에 설정하기를 선택했습니다.');
      }

      document.getElementById('onboarding-modal').style.display = 'none';
    }
  </script>
</body>
</html>
